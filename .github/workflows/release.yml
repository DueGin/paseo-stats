name: Release

# Push a vX.Y.Z tag (created by `npm version`) to publish a release. Installed
# copies of the plugin offer the new GitHub release as an in-app update.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # npm provenance

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.ref_name }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Tag must point at main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "$TAG is not on main" >&2
            exit 1
          }

      - name: Tag must match the package version
        run: node scripts/check-version.mjs "$TAG"

      - run: npm ci

      - run: npm run check

      - name: Pack
        id: pack
        run: echo "file=$(npm pack --silent)" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${TAG#v}"
          if [[ "$(npm view "paseo-stats@$version" version 2>/dev/null)" == "$version" ]]; then
            echo "paseo-stats@$version is already on npm"
          elif [[ "$version" == *-* ]]; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi

      # Last, so the in-app updater only sees releases whose checks passed.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.pack.outputs.file }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            flags=(--verify-tag --generate-notes --title "$TAG")
            [[ "$TAG" == *-* ]] && flags+=(--prerelease)
            gh release create "$TAG" "$FILE" "${flags[@]}"
          fi
